# Self-test of all exercises, tool and logic tests, render (DE + EN),
# browser smoke test, deploy to GitHub Pages.
name: site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::yaml
            any::jsonlite
            any::testthat
            any::withr
            any::dplyr
            any::tidyr
            any::tibble
            any::effectsize
            any::parameters
            any::readr
            any::readxl
            any::janitor
            any::forcats
            any::lubridate
            any::stringr
            any::ggplot2
            any::datawizard
            any::psych
            any::correlation
            any::performance
            any::report
            any::gtsummary
            any::broom.helpers
            any::chromote
            any::processx

      - name: Exercise self-test (solution passes, starter fails)
        run: Rscript tools/selftest.R

      - name: Tool tests (generator, checks, self-test)
        run: Rscript -e 'testthat::test_dir("tools/tests", stop_on_failure = TRUE)'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Progress logic tests (Leitner, streak, completion)
        run: node --test tests/js

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19

      # Quarto resolves {{< include >}} before the pre-render hook runs,
      # so _generated/ has to exist before the first render.
      - name: Generate lesson blocks and review cards
        run: Rscript tools/generate.R

      - name: Render site
        run: quarto render

      - name: Browser smoke test (webR lesson, review, language switch)
        run: Rscript tests/smoke-test.R

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
