id: rg-i-interaction-read
lesson: regression-intermediate
order: 3
title:
  de: Eine Interaktion deuten
  en: Interpreting an interaction
kind: interpret
required: true
packages: []
data: []
setup: ""
prompt:
  de: |
    Nutzungsabsicht `bi` (1–7) in Abhängigkeit von Nützlichkeit `pu` (1–7) und
    Erfahrung `experience` (0–9 Jahre, Mittelwert 3). Modell A mit Rohwerten,
    Modell B mit zentrierten Prädiktoren, dazu einfache Steigungen von `pu`
    aus Modell B (gekürzt):

    ```
    Modell A: lm(bi ~ pu * experience)
    Parameter       | Coefficient |        95% CI |      p
    (Intercept)     |        3.17 | [ 2.35, 3.99] | < .001
    pu              |        0.16 | [-0.05, 0.36] | 0.135
    experience      |       -0.22 | [-0.48, 0.03] | 0.086
    pu × experience |        0.07 | [ 0.01, 0.13] | 0.019

    Modell B: lm(bi ~ pu_c * exp_c)
    Parameter       | Coefficient |        95% CI |      p
    (Intercept)     |        3.94 | [ 3.79, 4.09] | < .001
    pu_c            |        0.37 | [ 0.26, 0.48] | < .001
    exp_c           |        0.05 | [-0.03, 0.14] | 0.209
    pu_c × exp_c    |        0.07 | [ 0.01, 0.13] | 0.019

    estimate_slopes(fit_b, trend = "pu_c", by = "exp_c")
    exp_c | Slope |        95% CI |      p
    -3.00 |  0.16 | [-0.05, 0.36] |  0.135
     0.00 |  0.37 | [ 0.26, 0.48] | < .001
     3.00 |  0.58 | [ 0.37, 0.80] | < .001
    ```

    Welche Aussagen stimmen?

    1. In Modell A ist 0.16 der Effekt der Nützlichkeit für Personen ohne Erfahrung (0 Jahre); das ist dieselbe Steigung wie bei `exp_c = -3` in Modell B.
    2. Mit jedem Jahr Erfahrung steigt die Nutzungsabsicht pro Punkt Nützlichkeit um 0.07 Punkte mehr.
    3. Weil `pu` in Modell A nicht signifikant ist, hat die Nützlichkeit keinen Einfluss auf die Nutzungsabsicht.
    4. Durch das Zentrieren wird die Interaktion stärker; deshalb sollte man immer zentrieren.

    Gib die Nummern der richtigen Aussagen aufsteigend als Vektor ein, z. B. `c(1, 3)`.
  en: |
    Intention `bi` (1–7) depending on usefulness `pu` (1–7) and experience
    `experience` (0–9 years, mean 3). Model A with raw values, model B with
    centred predictors, plus simple slopes of `pu` from model B (shortened):

    ```
    Model A: lm(bi ~ pu * experience)
    Parameter       | Coefficient |        95% CI |      p
    (Intercept)     |        3.17 | [ 2.35, 3.99] | < .001
    pu              |        0.16 | [-0.05, 0.36] | 0.135
    experience      |       -0.22 | [-0.48, 0.03] | 0.086
    pu × experience |        0.07 | [ 0.01, 0.13] | 0.019

    Model B: lm(bi ~ pu_c * exp_c)
    Parameter       | Coefficient |        95% CI |      p
    (Intercept)     |        3.94 | [ 3.79, 4.09] | < .001
    pu_c            |        0.37 | [ 0.26, 0.48] | < .001
    exp_c           |        0.05 | [-0.03, 0.14] | 0.209
    pu_c × exp_c    |        0.07 | [ 0.01, 0.13] | 0.019

    estimate_slopes(fit_b, trend = "pu_c", by = "exp_c")
    exp_c | Slope |        95% CI |      p
    -3.00 |  0.16 | [-0.05, 0.36] |  0.135
     0.00 |  0.37 | [ 0.26, 0.48] | < .001
     3.00 |  0.58 | [ 0.37, 0.80] | < .001
    ```

    Which statements are true?

    1. In model A, 0.16 is the effect of usefulness for people without experience (0 years); it is the same slope as at `exp_c = -3` in model B.
    2. With each year of experience, intention rises by 0.07 points more per point of usefulness.
    3. Because `pu` is not significant in model A, usefulness has no influence on intention.
    4. Centring makes the interaction stronger; that is why you should always centre.

    Enter the numbers of the true statements in ascending order as a vector, e.g. `c(1, 3)`.
starter: |
  # Nummern der richtigen Aussagen / numbers of the true statements, z. B. c(1, 3)
solution: |
  c(1, 2)
hints:
  - de: "In einem Modell mit Interaktion gilt der Koeffizient eines Prädiktors dort, wo der andere Prädiktor 0 ist."
    en: "In a model with an interaction, a predictor's coefficient applies where the other predictor is 0."
  - de: "Vergleiche die Zeile `pu × experience` in beiden Modellen und die Steigungen bei −3, 0 und 3."
    en: "Compare the row `pu × experience` in both models and the slopes at −3, 0 and 3."
  - de: "Zentrieren verschiebt nur den Nullpunkt; die Interaktion bleibt gleich. Zwei Aussagen stimmen."
    en: "Centring only moves the zero point; the interaction stays the same. Two statements are true."
explanation:
  de: |
    Richtig sind 1 und 2. Der Koeffizient von `pu` ist eine bedingte Steigung:
    In Modell A gilt er bei `experience = 0`, in Modell B bei durchschnittlicher
    Erfahrung. Die einfachen Steigungen zeigen das direkt: 0.16 bei 0 Jahren
    (nicht signifikant), 0.37 bei 3 und 0.58 bei 6 Jahren. Die Interaktion
    (0.07 pro Jahr) ist in beiden Modellen identisch. Aussage 3 ist falsch: Der
    Effekt ist nur für unerfahrene Personen unsicher, für die meisten deutlich.
    Aussage 4 ist falsch: Zentrieren ändert die Interaktion nicht, es macht die
    Haupteffekte deutbar. Berichte bei Interaktionen deshalb einfache Steigungen
    an sinnvollen Werten (z. B. 0, 3, 6 Jahre oder M ± 1 SD) oder zeige sie als
    Abbildung (`plot(estimate_slopes(...))`).
  en: |
    Statements 1 and 2 are true. The coefficient of `pu` is a conditional
    slope: in model A it applies at `experience = 0`, in model B at average
    experience. The simple slopes show this directly: 0.16 at 0 years (not
    significant), 0.37 at 3 and 0.58 at 6 years. The interaction (0.07 per
    year) is identical in both models. Statement 3 is false: the effect is
    uncertain only for inexperienced people, clear for most. Statement 4 is
    false: centring does not change the interaction, it makes the main effects
    interpretable. With interactions, therefore report simple slopes at
    sensible values (e.g. 0, 3, 6 years or M ± 1 SD) or show them as a figure
    (`plot(estimate_slopes(...))`).
misconception:
  de: "Ein nicht signifikanter Haupteffekt in einem Interaktionsmodell heißt, dass der Prädiktor keine Rolle spielt."
  en: "A non-significant main effect in an interaction model means that the predictor does not matter."
check:
  type: value
common_mistakes:
  - pattern: "^[\\s\\S]*?c\\([^)]*3[^)]*\\)\\s*$"
    message:
      de: "Aussage 3 stimmt nicht: 0.16 gilt nur bei 0 Jahren Erfahrung. Bei durchschnittlicher Erfahrung ist der Effekt 0.37, p < .001."
      en: "Statement 3 is false: 0.16 applies only at 0 years of experience. At average experience the effect is 0.37, p < .001."
  - pattern: "^[\\s\\S]*?c\\([^)]*4\\s*\\)\\s*$"
    message:
      de: "Aussage 4 stimmt nicht: Die Interaktion ist in beiden Modellen 0.07 mit p = .019."
      en: "Statement 4 is false: the interaction is 0.07 with p = .019 in both models."
