id: pw-i-superpower
lesson: power-intermediate
order: 2
title:
  de: Power für Messwiederholung mit Superpower
  en: Power for repeated measures with Superpower
kind: write
required: true
packages: [Superpower]
data: []
setup: |
  library(Superpower)
prompt:
  de: |
    Eine neue Studie im Fahrsimulator vergleicht drei Varianten einer
    Übernahmewarnung innerhalb der Personen (1 Faktor, 3 Stufen, `"3w"`).
    Erwartet werden mittlere Reaktionszeiten von 1000, 960 und 940 ms bei einer
    SD von 140 ms. In der Pilotstudie korrelierten die Personenmittel zwischen
    den Bedingungen zu etwa 0.85.

    Welche Power hat die Studie mit 20 Personen für den Haupteffekt? Lege das
    Design mit `ANOVA_design()` an (`plot = FALSE`) und rechne
    `ANOVA_exact(design, verbose = FALSE)`. Gib die Power aus `main_results`
    (in Prozent) auf 1 Stelle gerundet zurück. Warnungen von ggplot2 aus
    Superpower kannst du ignorieren.
  en: |
    A new driving simulator study compares three variants of a take-over
    warning within participants (1 factor, 3 levels, `"3w"`). Expected are
    mean reaction times of 1000, 960 and 940 ms with an SD of 140 ms. In the
    pilot study, the participant means correlated at about 0.85 across
    conditions.

    What power does the study have with 20 participants for the main effect?
    Set up the design with `ANOVA_design()` (`plot = FALSE`) and compute
    `ANOVA_exact(design, verbose = FALSE)`. Return the power from
    `main_results` (in percent) rounded to 1 decimal. You can ignore ggplot2
    warnings from Superpower.
starter: |
  design <- ANOVA_design(
    design = "3w", n = 20, mu = c(1000, 960, 940), sd = 140,
    plot = FALSE
  )
  result <- ANOVA_exact(design, verbose = FALSE)
  round(result$main_results$power, 1)
solution: |
  design <- ANOVA_design(
    design = "3w", n = 20, mu = c(1000, 960, 940), sd = 140, r = 0.85,
    plot = FALSE
  )
  result <- ANOVA_exact(design, verbose = FALSE)
  round(result$main_results$power, 1)
hints:
  - de: "Bei Messwiederholung hängt die Power stark davon ab, wie eng die Messungen derselben Person zusammenhängen. Wo steht das im Design?"
    en: "With repeated measures, power depends heavily on how closely the measurements of the same participant are related. Where does that go in the design?"
  - de: "`ANOVA_design()` hat dafür das Argument `r` (Korrelation zwischen den Stufen innerhalb der Person); ohne Angabe nimmt es 0 an."
    en: "`ANOVA_design()` has the argument `r` for it (correlation between levels within participants); without it, it assumes 0."
  - de: "`r = 0.85` in `ANOVA_design()` ergänzen."
    en: "Add `r = 0.85` to `ANOVA_design()`."
explanation:
  de: |
    Power = 87.5 % (partielles η² = .25, Cohens f = 0.58). Ohne Korrelation
    (`r = 0`, wie zwischen Gruppen) wären es nur 20.3 %, mit r = 0.5 37.1 %.
    Die Messwiederholung ist so effizient, weil die stabilen Unterschiede
    zwischen Personen aus dem Fehler herausfallen; je höher r, desto kleiner
    die Fehlervarianz der Differenzen. Darum gehört r in jede Poweranalyse für
    Messwiederholung, am besten aus Vorstudien und eher vorsichtig gewählt.
    `ANOVA_exact()` rechnet exakt mit einem idealen Datensatz (keine
    Simulation) und gibt auch die Power der paarweisen Vergleiche
    (`pc_results`): Für 1000 vs. 960 ms sind es nur 60 %. Plane auf die
    Vergleiche, die du wirklich testen willst, nicht nur auf den
    Omnibus-Test.
  en: |
    Power = 87.5 % (partial η² = .25, Cohen's f = 0.58). Without correlation
    (`r = 0`, as between groups) it would be only 20.3 %, with r = 0.5 37.1 %.
    Repeated measures are so efficient because the stable differences between
    participants drop out of the error; the higher r, the smaller the error
    variance of the differences. So r belongs in every power analysis for
    repeated measures, ideally from earlier studies and chosen cautiously.
    `ANOVA_exact()` computes exactly with an ideal data set (no simulation)
    and also gives the power of the pairwise comparisons (`pc_results`): for
    1000 vs. 960 ms it is only 60 %. Plan for the comparisons you actually
    want to test, not just for the omnibus test.
misconception:
  de: "Für Messwiederholung kann man die Power wie für unabhängige Gruppen rechnen; die Korrelation spielt keine Rolle."
  en: "For repeated measures you can compute power as for independent groups; the correlation plays no role."
check:
  type: value
  tolerance: 1.0e-6
common_mistakes:
  - pattern: "design\\s*=\\s*\"3b\""
    message:
      de: "`\"3b\"` ist ein Zwischensubjektfaktor. Hier sieht jede Person alle drei Warnungen: `\"3w\"`."
      en: "`\"3b\"` is a between-subjects factor. Here, each participant sees all three warnings: `\"3w\"`."
  - pattern: "^(?![\\s\\S]*\\br\\s*=)"
    message:
      de: "Ohne `r` nimmt Superpower an, dass die Messungen einer Person nicht zusammenhängen (r = 0). Die Pilotstudie sagt 0.85."
      en: "Without `r`, Superpower assumes the measurements of a participant are unrelated (r = 0). The pilot study says 0.85."
  - pattern: "n\\s*=\\s*60"
    message:
      de: "`n` ist bei einem reinen Innersubjektdesign die Zahl der Personen: 20."
      en: "In a purely within-subjects design, `n` is the number of participants: 20."
