# Lesson metadata; exercises are the other *.yml files in this folder
# (sorted by `order`), the knowledge check is quiz.yml.
lesson: group-comparisons-beginner
minutes: 40
prerequisites: [descriptives-beginner]
packages: [dplyr, effectsize, parameters]
data: [driving_sim]
goals:
  de:
    - Zwei unabhängige Gruppen mit dem Welch-t-Test vergleichen
    - Den Unterschied als Effektgröße (Cohen's d) mit Konfidenzintervall berichten
    - Messwiederholungen vor dem Test pro Person zusammenfassen
  en:
    - Compare two independent groups with Welch's t-test
    - Report the difference as an effect size (Cohen's d) with a confidence interval
    - Aggregate repeated measurements per person before testing
