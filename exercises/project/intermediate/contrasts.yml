id: pj-i-contrasts
lesson: project-intermediate
order: 4
title:
  de: Prototypen paarweise vergleichen
  en: Compare prototypes pairwise
kind: write
required: true
packages: [dplyr, lme4, lmerTest, emmeans]
data: [usability]
setup: |
  library(dplyr)
  library(lmerTest)
  library(emmeans)
  solved <- usability |>
    filter(success == 1)
  fit <- lmer(
    log(time_s) ~ prototype + position + (1 | participant) + (1 | task),
    data = solved
  )
prompt:
  de: |
    `fit` ist das Zeitmodell aus Schritt 3. Vergleiche die drei Prototypen
    paarweise mit emmeans, so wie der Plan es vorsieht:

    - Freiheitsgrade nach Satterthwaite (wie lmerTest),
    - Ergebnis auf der Originalskala als **Zeitverhältnis**
      (`type = "response"`),
    - Richtung „späterer Prototyp durch früheren“ (B / A, C / A, C / B),
    - p-Werte nach Holm korrigiert, mit KI.

    Lege das Ergebnis als Data Frame `prototype_contrasts` ab.
  en: |
    `fit` is the time model from step 3. Compare the three prototypes
    pairwise with emmeans, as the plan specifies:

    - Satterthwaite degrees of freedom (as in lmerTest),
    - result on the original scale as a **time ratio** (`type = "response"`),
    - direction "later prototype divided by earlier one" (B / A, C / A,
      C / B),
    - p-values Holm-corrected, with CI.

    Store the result as the data frame `prototype_contrasts`.
starter: |
  prototype_contrasts <- emmeans(fit, ~ prototype) |>
    pairs() |>
    as.data.frame()
solution: |
  prototype_contrasts <- emmeans(
    fit, ~ prototype,
    lmer.df = "satterthwaite", type = "response"
  ) |>
    pairs(reverse = TRUE, adjust = "holm") |>
    summary(infer = TRUE) |>
    as.data.frame()
hints:
  - de: "Die Einstellungen für Freiheitsgrade und Skala gehören in `emmeans()`, Richtung und Korrektur in `pairs()`."
    en: "The settings for degrees of freedom and scale go into `emmeans()`, direction and correction into `pairs()`."
  - de: "`emmeans(fit, ~ prototype, lmer.df = \"satterthwaite\", type = \"response\")`; `pairs(reverse = TRUE, adjust = \"holm\")` dreht die Richtung. KIs liefert `summary(infer = TRUE)`."
    en: "`emmeans(fit, ~ prototype, lmer.df = \"satterthwaite\", type = \"response\")`; `pairs(reverse = TRUE, adjust = \"holm\")` flips the direction. `summary(infer = TRUE)` adds CIs."
  - de: "`emmeans(...) |> pairs(...) |> summary(infer = TRUE) |> as.data.frame()`"
    en: "`emmeans(...) |> pairs(...) |> summary(infer = TRUE) |> as.data.frame()`"
explanation:
  de: |
    Weil das Modell `log(time_s)` enthält, erkennt emmeans die
    Transformation: Mit `type = "response"` wird aus der Differenz der Logs
    ein Verhältnis. B / A = 0,88 heißt, mit B dauern gelöste Aufgaben 12 %
    kürzer (95-%-KI [0,79; 0,99], p = .020), mit C 15 % kürzer (0,85
    [0,75; 0,96], p = .006). B und C unterscheiden sich kaum (C / B = 0,96
    [0,85; 1,09], p = .47). `reverse = TRUE` macht aus „A / B“ (1,13) das
    leichter lesbare „B / A“. Die KIs sind für drei Vergleiche
    Bonferroni-angepasst (Holm gibt es nur für p-Werte); emmeans meldet
    das unter der Tabelle. Ohne `lmer.df` nimmt emmeans Kenward-Roger
    (braucht pbkrtest) und liefert leicht andere Freiheitsgrade als
    `summary(fit)`.
  en: |
    Because the model contains `log(time_s)`, emmeans detects the
    transformation: with `type = "response"`, the difference of logs becomes
    a ratio. B / A = 0.88 means that with B, solved tasks take 12% less
    time (95% CI [0.79, 0.99], p = .020), with C 15% less (0.85
    [0.75, 0.96], p = .006). B and C hardly differ (C / B = 0.96
    [0.85, 1.09], p = .47). `reverse = TRUE` turns "A / B" (1.13) into the
    easier-to-read "B / A". The CIs are Bonferroni-adjusted for three
    comparisons (Holm exists only for p-values); emmeans notes this below
    the table. Without `lmer.df`, emmeans uses Kenward-Roger (needs
    pbkrtest) and gives slightly different degrees of freedom from
    `summary(fit)`.
check:
  type: object
  name: prototype_contrasts
  tolerance: 1.0e-4
common_mistakes:
  - pattern: "^(?![\\s\\S]*response)[\\s\\S]*"
    message:
      de: "Ohne `type = \"response\"` bleiben die Vergleiche Differenzen auf der Log-Skala; gefragt ist das Zeitverhältnis."
      en: "Without `type = \"response\"`, the comparisons stay differences on the log scale; the time ratio is asked for."
  - pattern: "^(?![\\s\\S]*holm)[\\s\\S]*"
    message:
      de: "Ohne Angabe korrigiert `pairs()` nach Tukey. Der Plan sieht Holm vor: `adjust = \"holm\"`."
      en: "By default, `pairs()` corrects with Tukey. The plan specifies Holm: `adjust = \"holm\"`."
  - pattern: "^(?![\\s\\S]*reverse)[\\s\\S]*"
    message:
      de: "`pairs()` rechnet „früher durch später“ (A / B). Mit `reverse = TRUE` steht B / A da."
      en: "`pairs()` computes \"earlier divided by later\" (A / B). With `reverse = TRUE` you get B / A."
  - pattern: "^(?![\\s\\S]*infer)[\\s\\S]*"
    message:
      de: "`pairs()` gibt nur Tests aus. `summary(infer = TRUE)` ergänzt die KIs."
      en: "`pairs()` only gives tests. `summary(infer = TRUE)` adds the CIs."
  - pattern: "^(?![\\s\\S]*satterthwaite)[\\s\\S]*"
    message:
      de: "Ohne `lmer.df = \"satterthwaite\"` rechnet emmeans mit Kenward-Roger; Freiheitsgrade und p weichen dann leicht vom Plan ab."
      en: "Without `lmer.df = \"satterthwaite\"`, emmeans uses Kenward-Roger; degrees of freedom and p then differ slightly from the plan."
