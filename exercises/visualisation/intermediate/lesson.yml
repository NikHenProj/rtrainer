# Lesson metadata; exercises are the other *.yml files in this folder
# (sorted by `order`), the knowledge check is quiz.yml.
lesson: visualisation-intermediate
minutes: 55
prerequisites: [visualisation-beginner, group-comparisons-beginner]
packages: [dplyr, ggplot2, modelbased, patchwork]
data: [driving_sim, survey]
goals:
  de:
    - Mittelwerte mit 95-%-Konfidenzintervall aus Personenmitteln darstellen
    - Modellvorhersagen mit Konfidenzband aus modelbased plotten
    - Abbildungen in fester Größe und Auflösung für ein Manuskript speichern
    - Mehrere Plots mit patchwork zu einer gekennzeichneten Abbildung kombinieren
  en:
    - Show means with 95% confidence intervals from participant means
    - Plot model predictions with a confidence band from modelbased
    - Save figures at a fixed size and resolution for a manuscript
    - Combine several plots into one tagged figure with patchwork
