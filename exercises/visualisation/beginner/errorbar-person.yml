id: vi-b-errorbar-person
lesson: visualisation-beginner
order: 4
title:
  de: Fehlerbalken aus Personenmitteln
  en: Error bars from participant means
kind: debug
required: true
packages: [dplyr, ggplot2]
data: [driving_sim]
setup: |
  library(dplyr)
  library(ggplot2)
prompt:
  de: |
    Der Plot soll pro Bedingung den Mittelwert der Reaktionszeit mit
    Fehlerbalken ± 1 Standardfehler zeigen. Einheit ist die Person: erst pro
    Person und Bedingung mitteln, dann über die 40 Personen.

    Der Code läuft, aber die Fehlerbalken sind zu schmal. Repariere die
    Zusammenfassung `rt_summary`; behalte den Plot sowie die Spaltennamen `m`
    und `se`.
  en: |
    The plot should show the mean reaction time per condition with error bars
    ± 1 standard error. The unit is the participant: first average per
    participant and condition, then across the 40 participants.

    The code runs, but the error bars are too narrow. Fix the summary
    `rt_summary`; keep the plot and the column names `m` and `se`.
starter: |
  rt_summary <- driving_sim |>
    summarise(
      m = mean(rt_ms, na.rm = TRUE),
      se = sd(rt_ms, na.rm = TRUE) / sqrt(sum(!is.na(rt_ms))),
      .by = condition
    )

  ggplot(rt_summary, aes(condition, m)) +
    geom_point() +
    geom_errorbar(aes(ymin = m - se, ymax = m + se), width = 0.2)
solution: |
  rt_summary <- driving_sim |>
    summarise(rt_ms = mean(rt_ms, na.rm = TRUE), .by = c(participant, condition)) |>
    summarise(m = mean(rt_ms), se = sd(rt_ms) / sqrt(n()), .by = condition)

  ggplot(rt_summary, aes(condition, m)) +
    geom_point() +
    geom_errorbar(aes(ymin = m - se, ymax = m + se), width = 0.2)
hints:
  - de: "Wie viele unabhängige Einheiten stecken im `se` des Starters pro Bedingung?"
    en: "How many independent units are in the starter's `se` per condition?"
  - de: "Der Starter rechnet über 160 Durchgänge je Bedingung; es sind aber nur 40 Personen."
    en: "The starter computes over 160 trials per condition, but there are only 40 participants."
  - de: "Zuerst `summarise(rt_ms = mean(rt_ms, na.rm = TRUE), .by = c(participant, condition))`, dann `m` und `se = sd(rt_ms) / sqrt(n())` pro `condition`."
    en: "First `summarise(rt_ms = mean(rt_ms, na.rm = TRUE), .by = c(participant, condition))`, then `m` and `se = sd(rt_ms) / sqrt(n())` per `condition`."
explanation:
  de: |
    Über alle Durchgänge gerechnet ist `n` = 160 statt 40, und die SD enthält
    das Rauschen innerhalb der Personen statt der Unterschiede zwischen ihnen.
    Der Standardfehler fällt dadurch um rund 40 % zu klein aus (visual
    14 statt 23 ms); die Balken versprechen eine Genauigkeit, die die Stichprobe
    nicht hat. Auch der Mittelwert ändert sich leicht, weil Personen mit
    fehlenden Durchgängen sonst weniger Gewicht bekommen. Bei Messwiederholung
    sind solche Balken für Vergleiche zwischen Bedingungen übrigens konservativ;
    für Vergleiche innerhalb der Personen gibt es korrigierte Intervalle
    (Cousineau-Morey, Stufe Intermediate).
  en: |
    Computed over all trials, `n` is 160 instead of 40, and the SD contains the
    noise within participants instead of the differences between them. The
    standard error is thus about 40 % too small (visual 14 instead of 23 ms);
    the bars promise a precision the sample does not have. The mean also changes
    slightly, because participants with missing trials otherwise get less weight.
    With repeated measures, such bars are conservative for comparisons between
    conditions; for within-participant comparisons there are corrected intervals
    (Cousineau-Morey, intermediate level).
misconception:
  de: "Durchgänge derselben Person sind keine unabhängigen Beobachtungen; in den Standardfehler gehören die Personen, nicht alle Durchgänge."
  en: "Trials of the same participant are not independent observations; the standard error is about participants, not all trials."
check:
  type: plot
  check_data: true
common_mistakes:
  - pattern: "^(?![\\s\\S]*participant)[\\s\\S]*"
    message:
      de: "Die Zusammenfassung läuft direkt über alle Durchgänge: `n` ist dann 160 statt 40 und `se` zu klein. Erst pro `participant` und Bedingung mitteln."
      en: "The summary runs directly over all trials: `n` is then 160 instead of 40 and `se` too small. First average per `participant` and condition."
  - pattern: "sqrt\\(\\s*(40|160)\\s*\\)"
    message:
      de: "`n` nicht fest eintragen, sondern mit `n()` zählen; so bleibt der Code richtig, wenn Personen fehlen."
      en: "Do not hard-code `n`; count it with `n()` so the code stays right when participants are missing."
  - pattern: "^(?![\\s\\S]*na\\.rm)[\\s\\S]*mean\\(\\s*rt_ms"
    message:
      de: "Einige `rt_ms` fehlen; ohne `na.rm = TRUE` wird der Personenmittelwert `NA`."
      en: "Some `rt_ms` are missing; without `na.rm = TRUE` the participant mean becomes `NA`."
