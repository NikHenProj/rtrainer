# Lesson metadata; exercises are the other *.yml files in this folder
# (sorted by `order`), the knowledge check is quiz.yml.
lesson: glm-intermediate
minutes: 55
prerequisites: [regression-intermediate]
packages: [dplyr, parameters, performance, marginaleffects, sandwich]
data: [usability]
goals:
  de:
    - Erfolg/Misserfolg mit logistischer Regression modellieren und Odds Ratios deuten
    - Ergebnisse mit marginaleffects in Wahrscheinlichkeiten und Prozentpunkte übersetzen
    - Zählwerte (Fehler) mit Poisson-Regression modellieren und Rate Ratios deuten
    - Überdispersion und Messwiederholung erkennen und absichern (quasipoisson, cluster-robuste Standardfehler)
  en:
    - Model success/failure with logistic regression and interpret odds ratios
    - Translate results into probabilities and percentage points with marginaleffects
    - Model counts (errors) with Poisson regression and interpret rate ratios
    - Detect and handle overdispersion and repeated measures (quasipoisson, cluster-robust standard errors)
