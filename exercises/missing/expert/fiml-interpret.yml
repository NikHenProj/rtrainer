id: ms-e-fiml-interpret
lesson: missing-expert
order: 5
title:
  de: FIML, Fallausschluss und Imputation vergleichen
  en: Comparing FIML, case deletion and imputation
kind: interpret
required: false
packages: []
data: []
setup: ""
prompt:
  de: |
    Dieselbe Frage (Frustration nach Bedienform, kontrolliert für
    Technikaffinität), vier Auswertungen. Bei 6 von 160 Personen fehlt
    `tlx_frustration`, Prädiktoren sind vollständig.

    ```
                                       b(voice)    SE
    A  lm(), Fallausschluss (n = 154)     9.29   2.97
    B  lavaan, FIML ohne Hilfsvariablen   9.29   2.95
    C  lavaan, FIML + 5 TLX-Skalen als    9.48   2.91
       Hilfsvariablen (semTools)
    D  mice (m = 10), alle TLX-Skalen     9.58   2.95
    ```

    Welche Aussagen stimmen?

    1. B entspricht A, weil nur das Ergebnis fehlt und FIML ohne weitere Variablen keine zusätzliche Information hat.
    2. FIML füllt die fehlenden Werte mit Schätzungen und rechnet dann mit dem vollständigen Datensatz.
    3. C und D nutzen dieselbe Information (die übrigen TLX-Skalen) und setzen beide MAR voraus; deshalb liegen sie nah beieinander.
    4. FIML ist immer besser als Mehrfachimputation, weil es ohne Zufallszahlen auskommt.

    Gib die Nummern der richtigen Aussagen aufsteigend als Vektor ein, z. B. `c(1, 2)`.
  en: |
    The same question (frustration by input mode, controlling for technology
    affinity), four analyses. 6 of 160 respondents are missing `tlx_frustration`;
    the predictors are complete.

    ```
                                       b(voice)    SE
    A  lm(), case deletion (n = 154)      9.29   2.97
    B  lavaan, FIML without auxiliaries   9.29   2.95
    C  lavaan, FIML + 5 TLX subscales as  9.48   2.91
       auxiliary variables (semTools)
    D  mice (m = 10), all TLX subscales   9.58   2.95
    ```

    Which statements are true?

    1. B equals A because only the outcome is missing and FIML without further variables has no additional information.
    2. FIML fills in the missing values with estimates and then analyses the complete dataset.
    3. C and D use the same information (the other TLX subscales) and both assume MAR; that is why they are close.
    4. FIML is always better than multiple imputation because it needs no random numbers.

    Type the numbers of the true statements in ascending order as a vector,
    e.g. `c(1, 2)`.
starter: |
  # Nummern der richtigen Aussagen als Vektor / numbers of the true statements as a vector
solution: |
  c(1, 3)
hints:
  - de: "Woher sollte FIML in B etwas über die fehlenden Frustrationswerte wissen, wenn nur `interface` und `tech_affinity` im Modell sind?"
    en: "Where would FIML in B get anything about the missing frustration values when only `interface` and `tech_affinity` are in the model?"
  - de: "FIML maximiert die Likelihood mit allen beobachteten Werten jeder Person; es entsteht kein vervollständigter Datensatz."
    en: "FIML maximises the likelihood using all observed values of each person; no completed dataset is created."
  - de: "Beide Verfahren sind unter MAR gleichwertig, wenn sie dieselben Variablen nutzen. Was spricht in manchen Situationen für das eine oder andere?"
    en: "Both methods are equivalent under MAR when they use the same variables. What favours one or the other in some situations?"
explanation:
  de: |
    Richtig sind 1 und 3. FIML (full information maximum likelihood) schätzt die
    Parameter direkt aus allen beobachteten Werten jeder Person, ohne Werte
    einzusetzen. Fehlt nur das Ergebnis und gibt es keine weiteren Variablen, trägt
    eine Person ohne Ergebnis nichts zur Regression bei; B ist dann identisch mit A.
    Erst Hilfsvariablen (in lavaan über `semTools::sem.auxiliary()` oder
    „saturated correlates“) bringen Information ein, wie die TLX-Skalen in mice.
    Unter MAR und mit denselben Variablen liefern FIML und MI asymptotisch dasselbe.
    FIML ist bequem in lavaan und für SEM; MI ist flexibler (beliebige Modelle,
    kategoriale Variablen, Skalenwerte nach dem Imputieren, δ-Sensitivität).
  en: |
    Statements 1 and 3 are true. FIML (full information maximum likelihood)
    estimates the parameters directly from all observed values of each person,
    without filling in values. If only the outcome is missing and there are no
    further variables, a person without an outcome contributes nothing to the
    regression; B is then identical to A. Only auxiliary variables (in lavaan via
    `semTools::sem.auxiliary()` or "saturated correlates") bring in information,
    like the TLX subscales in mice. Under MAR and with the same variables, FIML and
    MI give asymptotically the same result. FIML is convenient in lavaan and for
    SEM; MI is more flexible (any model, categorical variables, scale scores after
    imputing, δ sensitivity).
misconception:
  de: "FIML ist eine Imputationsmethode, die fehlende Werte einsetzt."
  en: "FIML is an imputation method that fills in missing values."
check:
  type: value
common_mistakes:
  - pattern: "\\b2\\b"
    message:
      de: "Aussage 2 stimmt nicht: FIML setzt keine Werte ein, sondern nutzt die beobachteten Werte direkt in der Likelihood."
      en: "Statement 2 is false: FIML fills in no values but uses the observed values directly in the likelihood."
  - pattern: "\\b4\\b"
    message:
      de: "Aussage 4 stimmt nicht: Unter MAR und mit denselben Variablen sind beide gleichwertig; MI ist sogar flexibler."
      en: "Statement 4 is false: under MAR and with the same variables both are equivalent; MI is even more flexible."
