# Lesson metadata; exercises are the other *.yml files in this folder
# (sorted by `order`), the knowledge check is quiz.yml.
lesson: sem-intermediate
minutes: 55
prerequisites: [scales-intermediate]
langs: [de]
packages: [dplyr, lavaan, semTools, parameters]
data: [acceptance]
goals:
  de:
    - Ein Messmodell (CFA) in lavaan-Syntax aufschreiben und schätzen
    - Fitindizes (χ², CFI, RMSEA, SRMR) lesen und Richtwerte richtig einordnen
    - Standardisierte Ladungen prüfen und schwache Indikatoren finden
    - Konkurrierende Messmodelle vergleichen und ω aus dem Modell berechnen
  en:
    - Write and fit a measurement model (CFA) in lavaan syntax
    - Read fit indices (χ², CFI, RMSEA, SRMR) and use cut-offs correctly
    - Check standardised loadings and find weak indicators
    - Compare competing measurement models and compute ω from the model
