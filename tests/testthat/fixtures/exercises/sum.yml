id: fx-sum
topic: base
title: Summe gerader Zahlen
level: 1
kind: write
tags: [vektoren, filter]
prompt: Berechne die Summe aller geraden Zahlen von 1 bis 10.
starter: |
  x <- 1:10
solution: |
  x <- 1:10
  sum(x[x %% 2 == 0])
hints:
  - "`x %% 2 == 0` ist TRUE für gerade Zahlen."
  - "Indiziere mit `x[...]` und summiere."
  - "`sum(x[x %% 2 == 0])`"
explanation: Logische Indizierung wählt Elemente aus, `sum()` addiert sie.
misconception: "`%%` ist der Rest, nicht die ganzzahlige Division (`%/%`)."
check:
  type: value
common_mistakes:
  - pattern: "%/%"
    message: "`%/%` ist ganzzahlige Division, für gerade Zahlen brauchst du den Rest `%%`."
