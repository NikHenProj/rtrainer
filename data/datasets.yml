# Course datasets: file in data/ and the R code that loads it.
# The same code runs in the browser (webR) and in the self-test.
driving_sim:
  file: driving_sim.csv
  script: data-raw/driving_sim.R
  description:
    de: >-
      Fahrsimulator, Übernahmeaufforderungen: 40 Personen (20 novice, 20 experienced),
      je 3 Warnmodalitäten (condition) x 4 Durchgänge (trial). Reaktionszeit rt_ms,
      Spurabweichung lane_dev; einige fehlende Werte.
    en: >-
      Driving simulator, take-over requests: 40 participants (20 novice, 20 experienced),
      3 warning modalities (condition) x 4 trials each. Reaction time rt_ms,
      lane deviation lane_dev; some missing values.
  load: |
    driving_sim <- read.csv("data/driving_sim.csv")
    driving_sim$experience <- factor(driving_sim$experience, levels = c("novice", "experienced"))
    driving_sim$condition <- factor(driving_sim$condition, levels = c("visual", "auditory", "haptic"))
    driving_sim <- tibble::as_tibble(driving_sim)
survey:
  file: survey.csv
  script: data-raw/survey.R
  description:
    de: >-
      Online-Fragebogen nach einem Infotainment-Prototyp: 160 Befragte, zwischen
      den Gruppen interface = touch/voice. SUS (sus_01–sus_10, 1–5, gerade Items
      negativ formuliert), NASA-TLX roh (tlx_*, 0–100), Vertrauen (trust_1–trust_6,
      1–7, trust_3 und trust_5 umgepolt), Aufmerksamkeitsfrage, fehlende Werte.
    en: >-
      Online questionnaire after an infotainment prototype: 160 respondents,
      between groups interface = touch/voice. SUS (sus_01–sus_10, 1–5, even items
      negatively worded), raw NASA-TLX (tlx_*, 0–100), trust (trust_1–trust_6, 1–7,
      trust_3 and trust_5 reverse-keyed), attention check, missing values.
  load: |
    survey <- read.csv("data/survey.csv")
    survey$interface <- factor(survey$interface, levels = c("touch", "voice"))
    survey <- tibble::as_tibble(survey)
usability:
  file: usability.csv
  script: data-raw/usability.R
  description:
    de: >-
      Moderierter Usability-Test: 24 Personen (novice/expert) testen 3 Prototypen
      (A, B, C, Reihenfolge ausbalanciert, position) mit je 4 Aufgaben (task).
      Erfolg success (0/1), Zeit time_s (Abbruch bei 180 s), Fehler errors,
      Einfachheit seq (1–7). p07 hat Prototyp C nicht getestet.
    en: >-
      Moderated usability test: 24 participants (novice/expert) test 3 prototypes
      (A, B, C, counterbalanced order, position) with 4 tasks each (task).
      Success (0/1), time_s (timeout at 180 s), errors, ease rating seq (1–7).
      p07 did not test prototype C.
  load: |
    usability <- read.csv("data/usability.csv")
    usability$expertise <- factor(usability$expertise, levels = c("novice", "expert"))
    usability$prototype <- factor(usability$prototype, levels = c("A", "B", "C"))
    usability$task <- factor(usability$task, levels = c("search", "filter", "compare", "checkout"))
    usability <- tibble::as_tibble(usability)
raw_export:
  file: raw_export.csv
  script: data-raw/raw_export.R
  description:
    de: >-
      Unordentlicher Export einer Feedback-Umfrage (CSV mit Semikolon und
      Dezimalkomma): Exportinfo über der Kopfzeile, zweite Kopfzeile mit Fragetext,
      gemischte Datumsformate, Alter als Text, uneinheitliche Kategorien,
      Testantworten, Duplikate, Freitext. Wird nicht vorab eingelesen, nur der Pfad.
    en: >-
      Messy export of a feedback survey (CSV with semicolons and decimal commas):
      export info above the header, a second header row with question text, mixed
      date formats, age as text, inconsistent categories, test responses,
      duplicates, free text. Not read in advance, only the path is set.
  load: |
    raw_export_csv <- "data/raw_export.csv"
raw_export_xlsx:
  file: raw_export.xlsx
  script: data-raw/raw_export.R
  description:
    de: >-
      Dieselben Antworten wie raw_export als Excel-Datei: Blatt „Export“ mit
      Titelzeilen über der Kopfzeile und Summenzeile darunter, Datum teils als
      Excel-Datum, teils als Text; Blatt „Codebook“. Nur der Pfad wird gesetzt.
    en: >-
      The same responses as raw_export as an Excel file: sheet "Export" with title
      rows above the header and a total row below, dates partly Excel dates, partly
      text; sheet "Codebook". Only the path is set.
  load: |
    raw_export_xlsx <- "data/raw_export.xlsx"
acceptance:
  file: acceptance.csv
  script: data-raw/acceptance.R
  description:
    de: >-
      Akzeptanzfragebogen zu einem Fahrerassistenzsystem nach einer Testfahrt
      (Technology Acceptance Model): 300 Fahrerinnen und Fahrer. Nützlichkeit
      (pu_1–pu_5), Bedienbarkeit (peou_1–peou_4, peou_3 umgepolt), Vertrauen
      (trust_1–trust_5, trust_4 umgepolt), Nutzungsabsicht (bi_1–bi_4), alle 1–7;
      dazu Alter, Geschlecht und Erfahrung mit Assistenzsystemen in Jahren
      (experience). Keine fehlenden Werte.
    en: >-
      Acceptance questionnaire for a driver assistance system after a test drive
      (Technology Acceptance Model): 300 drivers. Perceived usefulness (pu_1–pu_5),
      ease of use (peou_1–peou_4, peou_3 reverse-keyed), trust (trust_1–trust_5,
      trust_4 reverse-keyed), behavioural intention (bi_1–bi_4), all 1–7; plus age,
      gender and years of experience with driver assistance (experience). No
      missing values.
  load: |
    acceptance <- read.csv("data/acceptance.csv")
    acceptance <- tibble::as_tibble(acceptance)
